<html lang="en">
<head>
<meta charset="utf-8" />
<title>SheRISE — Bold & Empowering · Design Reference</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>/* SheRISE clickable prototype shell — top concept switcher, left screen rail, canvas main */

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--shell-bg, #0a0a0a);
  color: #fff;
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 999px;
  border: 2px solid var(--shell-bg, #0a0a0a);
}
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

/* Focus */
:focus-visible {
  outline: 2px solid #E8B858;
  outline-offset: 2px;
  border-radius: 6px;
}

/* ============ Top concept switcher ============ */
.sr-dirbar {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: rgba(20,18,20,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  padding: 4px;
  display: flex;
  gap: 2px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.sr-dirbar-item {
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.55);
  cursor: pointer;
  transition: all 160ms cubic-bezier(0.22, 1, 0.36, 1);
  letter-spacing: -0.005em;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.sr-dirbar-item .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
  opacity: 0.75;
}
.sr-dirbar-item:hover:not([data-active="true"]) {
  color: #fff;
  background: rgba(255,255,255,0.05);
}
.sr-dirbar-item[data-active="true"] {
  color: #0a0a0a;
  background: #fff;
}
.sr-dirbar-item[data-active="true"][data-concept="c1"] { background: #C55A3B; color: #FFF7EC; }
.sr-dirbar-item[data-active="true"][data-concept="c2"] { background: #E8B84A; color: #2A0E2E; }
.sr-dirbar-item[data-active="true"][data-concept="c3"] { background: #0F6B70; color: #fff; }

/* Kbd hint on the far right of the dirbar */
.sr-dirbar-hint {
  padding: 8px 14px 8px 10px;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace;
  display: flex; align-items: center; gap: 6px;
}
.sr-kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 4px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.75);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 500;
}

/* ============ Left screen rail ============ */
.sr-screenbar {
  position: fixed;
  left: 14px;
  top: 74px;
  bottom: 14px;
  z-index: 90;
  background: rgba(20,18,20,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  width: 240px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

/* Grouped nav sections */
.sr-screenbar details {
  padding: 0;
  margin: 4px 0 0;
}
.sr-screenbar details summary {
  padding: 8px 10px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.4);
  font-family: 'IBM Plex Mono', monospace;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sr-screenbar details summary::-webkit-details-marker { display: none; }
.sr-screenbar details summary::before {
  content: '▸';
  margin-right: 6px;
  transition: transform 160ms;
  color: rgba(255,255,255,0.3);
}
.sr-screenbar details[open] summary::before {
  transform: rotate(90deg);
  display: inline-block;
}
.sr-screenbar details summary .group-count {
  font-size: 9px;
  color: rgba(255,255,255,0.25);
  font-weight: 500;
}
.sr-screenbar-group-label {
  padding: 10px 10px 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.35);
  font-family: 'IBM Plex Mono', monospace;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sr-screenbar-group-label .count {
  font-size: 9px;
  color: rgba(255,255,255,0.25);
}
.sr-screenbar-item {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.65);
  cursor: pointer;
  transition: all 140ms;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sr-screenbar-item .num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  min-width: 16px;
  letter-spacing: 0.02em;
}
.sr-screenbar-item[data-active="true"] {
  background: rgba(255,255,255,0.08);
  color: #fff;
}
.sr-screenbar-item[data-active="true"][data-concept="c1"] { background: rgba(197,90,59,0.22); color: #F4C8B3; }
.sr-screenbar-item[data-active="true"][data-concept="c2"] { background: rgba(232,184,74,0.22); color: #F6D68A; }
.sr-screenbar-item[data-active="true"][data-concept="c3"] { background: rgba(15,107,112,0.28); color: #A6D9DC; }
.sr-screenbar-item[data-active="true"] .num { color: currentColor; opacity: 0.7; }
.sr-screenbar-item:hover:not([data-active="true"]) {
  background: rgba(255,255,255,0.04);
  color: #fff;
}

/* Overview link at top of rail */
.sr-screenbar-overview {
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  cursor: pointer;
  background: rgba(255,255,255,0.05);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 140ms;
}
.sr-screenbar-overview:hover { background: rgba(255,255,255,0.08); }
.sr-screenbar-overview[data-active="true"] { background: rgba(255,255,255,0.12); color: #fff; }

/* ============ Main canvas ============ */
.sr-canvas {
  min-height: 100vh;
  padding: 80px 40px 40px 280px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  transition: background 300ms ease;
}
.sr-canvas[data-concept="c1"] { background: #1a1613; }
.sr-canvas[data-concept="c2"] { background: #180818; }
.sr-canvas[data-concept="c3"] { background: #10141a; }

.sr-frame {
  width: 100%;
  max-width: 1440px;
  border-radius: 16px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 40px 100px -40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
  position: relative;
}

/* Frame label — floats above the frame */
.sr-frame-label {
  position: sticky;
  top: 80px;
  z-index: 5;
  padding-bottom: 16px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  color: rgba(255,255,255,0.55);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.sr-frame-label .title {
  color: rgba(255,255,255,0.85);
  font-family: 'Instrument Serif', serif;
  font-size: 26px;
  letter-spacing: -0.01em;
  text-transform: none;
  font-weight: 400;
}
.sr-frame-label .concept-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sr-frame-label .concept-tag .swatch {
  width: 10px; height: 10px; border-radius: 50%;
}

.sr-mobile-stage {
  padding: 60px 40px;
  display: flex;
  gap: 40px;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
}
.sr-desktop-stage {
  padding: 0;
}

/* Phone frame */
.sr-phone {
  width: 390px;
  height: 780px;
  border-radius: 40px;
  background: var(--phone-bg, #fff);
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 8px rgba(255,255,255,0.04), 0 0 0 9px rgba(255,255,255,0.08);
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.sr-phone-status {
  height: 44px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px 0 30px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--phone-fg, #111);
  flex-shrink: 0;
}
.sr-phone-status .icons { display: flex; gap: 6px; align-items: center; }
.sr-phone-body {
  flex: 1;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
.sr-phone-home {
  position: absolute;
  left: 50%; bottom: 8px;
  transform: translateX(-50%);
  width: 130px; height: 5px;
  border-radius: 3px;
  background: var(--phone-fg, #111);
  opacity: 0.35;
  z-index: 20;
}
.sr-phone-caption {
  margin-top: 14px;
  text-align: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
}

/* Photo placeholder */
.sr-photo-ph {
  position: relative;
  overflow: hidden;
  display: flex; align-items: flex-end;
  padding: 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.02em;
  color: rgba(0,0,0,0.55);
}
.sr-photo-ph::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(135deg, rgba(0,0,0,0.03) 0 1px, transparent 1px 8px),
    var(--ph-tone, #E8DDD0);
}
.sr-photo-ph > * { position: relative; z-index: 1; }

/* ============ Overview page ============ */
.sr-overview {
  width: 100%;
  max-width: 1440px;
  color: #fff;
  padding: 0;
}
.sr-overview-hero {
  padding: 60px 60px 40px;
  border-radius: 20px;
  background: linear-gradient(135deg, #1a1618 0%, #241a20 100%);
  border: 1px solid rgba(255,255,255,0.06);
  position: relative;
  overflow: hidden;
}
.sr-overview-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
}
.sr-overview-h1 {
  margin-top: 16px;
  font-family: 'Instrument Serif', serif;
  font-size: 88px;
  line-height: 0.98;
  letter-spacing: -0.02em;
  font-weight: 400;
  max-width: 900px;
}
.sr-overview-h1 em {
  color: #E8B858;
  font-style: italic;
}
.sr-overview-lede {
  margin-top: 20px;
  font-size: 17px;
  line-height: 1.6;
  color: rgba(255,255,255,0.7);
  max-width: 640px;
}
.sr-concepts-grid {
  margin-top: 32px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
}
.sr-concept-card {
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 300ms;
  display: flex;
  flex-direction: column;
  min-height: 380px;
  border: 1px solid rgba(255,255,255,0.06);
}
.sr-concept-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
}
.sr-concept-card .body {
  flex: 1;
  padding: 24px 24px 22px;
  display: flex; flex-direction: column; justify-content: space-between;
  gap: 20px;
}
.sr-concept-card .num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.7;
}
.sr-concept-card h3 {
  margin: 6px 0 0;
  font-size: 32px;
  line-height: 1.02;
  letter-spacing: -0.02em;
  font-weight: 400;
}
.sr-concept-card p {
  margin: 12px 0 0;
  font-size: 13px;
  line-height: 1.55;
  opacity: 0.75;
}
.sr-concept-card .actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.sr-concept-card .screen-chip {
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid currentColor;
  background: transparent;
  opacity: 0.85;
}
.sr-concept-card .cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin-top: 14px;
}

.sr-concept-card[data-concept="c1"] {
  background: linear-gradient(145deg, #C55A3B 0%, #7A3822 100%);
  color: #FFF7EC;
}
.sr-concept-card[data-concept="c1"] .cta { background: #FFF7EC; color: #7A3822; }
.sr-concept-card[data-concept="c1"] h3 { font-family: 'Instrument Serif', serif; }

.sr-concept-card[data-concept="c2"] {
  background: linear-gradient(160deg, #2A0E2E 0%, #D4306E 100%);
  color: #F5EFE6;
}
.sr-concept-card[data-concept="c2"] .cta { background: #E8B84A; color: #2A0E2E; }
.sr-concept-card[data-concept="c2"] h3 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -0.035em; }

.sr-concept-card[data-concept="c3"] {
  background: linear-gradient(145deg, #FAFAF7 0%, #E8F0F0 100%);
  color: #1A2028;
  border-color: rgba(15,107,112,0.15);
}
.sr-concept-card[data-concept="c3"] .cta { background: #0F6B70; color: #fff; }
.sr-concept-card[data-concept="c3"] h3 { font-family: 'IBM Plex Serif', serif; font-weight: 500; }

.sr-overview-meta {
  margin-top: 32px;
  padding: 24px 28px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
.sr-overview-meta .cell {
  border-left: 1px solid rgba(255,255,255,0.08);
  padding-left: 20px;
}
.sr-overview-meta .cell:first-child { border-left: none; padding-left: 0; }
.sr-overview-meta .cell-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
}
.sr-overview-meta .cell-value {
  margin-top: 6px;
  font-family: 'Instrument Serif', serif;
  font-size: 22px;
  line-height: 1.1;
  color: #fff;
}

/* Utilities */
.mono {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace;
}
</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Typewriter-cycles through `suggestions`. Clicking the field while a
// suggestion is animating freezes it as ghost text; Tab accepts it into the
// input. Enter posts __edit_mode_chat (host drops the text into the chat
// composer for the user to send). After the cycle the static placeholder
// types in and "Ideas" appears — clicking asks for three more suggestions.
function TweakSuggestionBar({
  suggestions = [],
  placeholder = 'Describe a tweak…',
  ideasPrompt = 'Suggest three more tweak ideas for this design and update the suggestions on TweakSuggestionBar.',
}) {
  const [val, setVal] = React.useState('');
  const [ghost, setGhost] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const inputRef = React.useRef(null);
  const tw = useTwkTypewriter(suggestions, { placeholder, enabled: !val && !ghost && !focused });

  const freeze = () => {
    tw.markPlayed();
    if (val || ghost) return;
    const target = !tw.done ? suggestions[tw.idx] : '';
    if (target) setGhost(target);
    inputRef.current?.focus();
  };

  const submit = () => {
    const v = (val || ghost).trim();
    if (!v) return;
    __twkSendChat(v);
    setVal('');
    setGhost('');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Tab' && ghost && !val) {
      e.preventDefault();
      setVal(ghost);
      setGhost('');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    } else if (e.key === 'Escape') {
      setGhost('');
    }
  };

  const requestIdeas = () => __twkSendChat(ideasPrompt);

  const showAnim = !val && !ghost && !focused && !tw.done;
  const showStatic = !val && !ghost && !focused && tw.done;

  return (
    <div className="twk-sugg" onMouseDown={freeze}>
      <div className="twk-sugg-field">
        <input
          ref={inputRef}
          value={val}
          placeholder={focused && !ghost ? placeholder : ''}
          onChange={(e) => { setVal(e.target.value); setGhost(''); }}
          onFocus={() => { setFocused(true); tw.markPlayed(); }}
          onBlur={() => { setFocused(false); if (!val) setGhost(''); }}
          onKeyDown={onKeyDown}
        />
        {showAnim && (
          <div className="twk-sugg-ghost">
            {tw.text}<span className="twk-sugg-caret" />
          </div>
        )}
        {showStatic && (
          <div className="twk-sugg-ghost">
            {tw.tail}{tw.tail.length < placeholder.length && <span className="twk-sugg-caret" />}
          </div>
        )}
        {ghost && !val && (
          <div className="twk-sugg-ghost hint">{ghost}</div>
        )}
      </div>
      {val || ghost ? (
        <button className="twk-sugg-send"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={submit}>
          Add
        </button>
      ) : tw.done && !focused ? (
        <button className="twk-sugg-ideas"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={requestIdeas}>
          Ideas <__TwkSpark />
        </button>
      ) : null}
    </div>
  );
}

// Minimal type→pause→erase cycler. Plays once per unique `items` content per
// session — a reload from a tweak-value write skips straight to done; a new
// suggestion set (after "Ideas") gets a fresh animation.
function useTwkTypewriter(items, { placeholder, typeMs = 35, eraseMs = 22, pauseMs = 1800, enabled = true } = {}) {
  // Dep mirrors the memo body verbatim so collidable joins like
  // ['a\nb','c'] vs ['a','b','c'] don't share a stale sessionStorage key
  // (gen-spark PR #28600 Bugbot R3 — minor divergence from Tiffany's
  // `items.join('\n')` dep; upstream report pending).
  const key = React.useMemo(() => '__twk_played:' + JSON.stringify(items), [JSON.stringify(items)]);
  const played = () => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } };

  const [text, setText] = React.useState('');
  const [tail, setTail] = React.useState(() => (items.length === 0 || played() ? placeholder : ''));
  const [idx, setIdx] = React.useState(0);
  const [done, setDone] = React.useState(() => items.length === 0 || played());
  const phase = React.useRef('type');
  const n = React.useRef(0);

  const markPlayed = React.useCallback(() => {
    try { sessionStorage.setItem(key, '1'); } catch {}
    setDone(true);
  }, [key]);

  React.useEffect(() => {
    const skip = items.length === 0 || played();
    setText(''); setIdx(0);
    setDone(skip);
    setTail(skip ? placeholder : '');
    phase.current = 'type'; n.current = 0;
  }, [key]);

  React.useEffect(() => {
    if (done || !enabled) return;
    const item = items[idx] ?? '';
    let t;
    const tick = () => {
      if (phase.current === 'type') {
        n.current++;
        setText(item.slice(0, n.current));
        if (n.current >= item.length) { phase.current = 'pause'; t = setTimeout(tick, pauseMs); }
        else t = setTimeout(tick, typeMs + Math.random() * 20);
      } else if (phase.current === 'pause') {
        phase.current = 'erase'; t = setTimeout(tick, eraseMs);
      } else {
        n.current--;
        setText(item.slice(0, n.current));
        if (n.current <= 0) {
          if (idx === items.length - 1) { markPlayed(); return; }
          phase.current = 'type'; setIdx((i) => i + 1);
        } else t = setTimeout(tick, eraseMs);
      }
    };
    phase.current = 'type'; n.current = 0; setText('');
    t = setTimeout(tick, 400);
    return () => clearTimeout(t);
  }, [idx, done, key, enabled, typeMs, eraseMs, pauseMs]);

  React.useEffect(() => {
    if (!done || tail === placeholder) return;
    let i = 0;
    const t = setInterval(() => {
      i++; setTail(placeholder.slice(0, i));
      if (i >= placeholder.length) clearInterval(t);
    }, 28);
    return () => clearInterval(t);
  }, [done, placeholder]);

  return { text, tail, idx, done, markPlayed };
}

Object.assign(window, { TweakSuggestionBar });

// Sparkline
function Spark({ data, color, height = 40, width = 120 }) {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * height;
    return `${x},${y}`;
  }).join(' ');
  const areaPoints = `0,${height} ${points} ${width},${height}`;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <polygon points={areaPoints} fill={color} opacity="0.12" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={width} cy={height - ((data[data.length-1] - min) / range) * height} r="3" fill={color} />
    </svg>
  );
}

// Ring progress
function Ring({ percent, size = 100, stroke = 8, color, bg, label, sublabel, fontFamily }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (percent / 100) * c;
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={bg} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
          style={{ transition: 'stroke-dashoffset .6s ease' }}
        />
      </svg>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
        fontFamily,
      }}>
        <div style={{ fontSize: size * 0.28, fontWeight: 600, lineHeight: 1 }}>{label}</div>
        {sublabel && <div style={{ fontSize: 10, opacity: 0.6, marginTop: 2, letterSpacing: '0.06em', textTransform: 'uppercase' }}>{sublabel}</div>}
      </div>
    </div>
  );
}

<script type="text/babel">/* SheRISE Bold & Empowering — design reference prototype (C2 only) */

const { useState, useEffect, useCallback } = React;

const INVENTORY = [
  {
    g: 'Onboarding & Auth',
    items: [

      { k: 'welcome',        l: 'Welcome carousel', C: 'C2Welcome' },

    ],
  },
  {
    g: 'Participant App',
    items: [
      { k: 'feed',            l: 'Community feed',      C: 'C2FeedScreen' },
      { k: 'composer',        l: 'Feed composer',       C: 'C2FeedScreen' },

      { k: 'trainer-chat',    l: 'Trainer chat',        C: 'C2TrainerChat' },
      { k: 'help-safety',     l: 'Help & safety',       C: 'C2HelpSafety' },
    ],
  },
  {
    g: 'Admin Web',
    items: [
      { k: 'admin-login',        l: 'Admin login',           C: 'C2AdminLogin' },
      { k: 'admin-overview',     l: 'Dashboard home',        C: 'C2AdminScreen' },
      { k: 'admin-participants', l: 'Participants list',     C: 'C2AdminParticipants' },
      { k: 'admin-participant',  l: 'Participant detail',    C: 'C2AdminParticipantDetail' },
      { k: 'admin-referrals',    l: 'Referral pipeline',     C: 'C2AdminReferrals' },
      { k: 'admin-content',      l: 'Content library',       C: 'C2AdminContent' },
      { k: 'admin-reports',      l: 'Reports & exports',     C: 'C2AdminReports' },
      { k: 'admin-broadcasts',   l: 'Broadcasts',            C: 'C2AdminBroadcasts' },
      { k: 'admin-trainers',     l: 'Trainers & sponsors',   C: 'C2AdminTrainers' },
    ],
  },
  {
    g: 'States',
    items: [
      { k: 'empty-feed', l: 'Empty feed (newcomer)', C: 'C2EmptyFeed' },
      { k: 'no-wifi',    l: 'Offline mode',          C: 'C2NoWifi' },
      { k: 'error',      l: 'Error / retry',         C: 'C2Error' },
    ],
  },
];

const flat = INVENTORY.flatMap(g => g.items);

function parseHash() {
  const h = window.location.hash.replace(/^#\/?/, '');
  return h || 'feed';
}

function App() {
  const [screen, setScreen] = useState(() => {
    if (window.location.hash) return parseHash();
    return localStorage.getItem('sr-c2-screen') || 'feed';
  });

  useEffect(() => {
    const hash = `#/${screen}`;
    if (window.location.hash !== hash) window.history.replaceState(null, '', hash);
    localStorage.setItem('sr-c2-screen', screen);
  }, [screen]);

  useEffect(() => {
    const onHash = () => {
      const s = parseHash();
      if (s !== screen && flat.find(f => f.k === s)) setScreen(s);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, [screen]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const keys = flat.map(f => f.k);
      const idx = keys.indexOf(screen);
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        setScreen(keys[(idx + 1) % keys.length]);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        setScreen(keys[(idx - 1 + keys.length) % keys.length]);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [screen]);

  const activeItem = flat.find(i => i.k === screen) || flat[0];
  const Comp = window[activeItem.C];
  const isDesktop = activeItem.k.startsWith('admin-');

  return (
    <>
      {/* Header */}
      <div className="sr-dirbar">
        <div className="sr-dirbar-item" data-active="true" data-concept="c2">
          <span className="dot" style={{ background: '#D4306E' }} />
          SheRISE · Bold &amp; Empowering
        </div>
        <div className="sr-dirbar-hint">
          <span className="sr-kbd">←</span><span className="sr-kbd">→</span>
          <span style={{ marginLeft: 4 }}>screens</span>
        </div>
      </div>

      {/* Left rail */}
      <div className="sr-screenbar">
        {INVENTORY.map((g, gi) => (
          <details key={g.g} open={gi < 2 || g.items.some(it => it.k === screen)}>
            <summary>{g.g} <span className="group-count">{g.items.length}</span></summary>
            {g.items.map((it, i) => (
              <div
                key={it.k}
                className="sr-screenbar-item"
                data-active={screen === it.k}
                data-concept="c2"
                onClick={() => setScreen(it.k)}
              >
                <span className="num">{String(i + 1).padStart(2, '0')}</span>
                {it.l}
              </div>
            ))}
          </details>
        ))}
      </div>

      {/* Main */}
      <div className="sr-canvas" data-concept="c2">
        <div style={{ width: '100%', maxWidth: 1440 }}>
          <div className="sr-frame-label">
            <div className="concept-tag">
              <span className="swatch" style={{ background: '#D4306E' }} />
              <span>Bold &amp; Empowering</span>
              <span style={{ opacity: 0.4 }}>·</span>
              <span>{activeItem.l}</span>
            </div>
            <div className="title">{activeItem.l}</div>
            <div>{isDesktop ? 'DESKTOP · 1440' : 'MOBILE · 390'}</div>
          </div>
          <div className="sr-frame">
            {Comp ? <Comp /> : <div style={{ padding: 60, textAlign: 'center', color: '#fff' }}>Component not found: {activeItem.C}</div>}
          </div>
        </div>
      </div>
    </>
  );
}

function bootstrap() {
  const root = document.getElementById('root');
  ReactDOM.createRoot(root).render(<App />);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}
</script>
